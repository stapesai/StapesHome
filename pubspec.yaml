name: jarvis
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0-282.3.beta <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_blue_plus: ^1.32.7
  image_picker: ^1.1.2
  image_cropper: ^7.1.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.11
  hive: ^2.2.3
  mobile_scanner: ^5.1.1
  lottie: ^3.1.2
  flutter_lints: ^4.0.0
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter 
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Malgun Gothic
      fonts:
        - asset: assets/fonts/malgun-gothic.ttf

